name: Build Droidspaces + SukiSU Kernel for RMX3366

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DEFCONFIG: vendor/kona-perf_defconfig
  KERNEL_BRANCH: resukisu
  KERNEL_REPO: RMX3366-Development/android_kernel_realme_sm8250

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (config + patches)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio python3 git lzop libssl-dev \
            flex bison libelf-dev curl zip

      - name: Clone Proton Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} \
            https://github.com/${{ env.KERNEL_REPO }}.git kernel

      - name: Apply Droidspaces + SukiSU kernel config
        run: |
          cd kernel
          DEFCONFIG_PATH="arch/arm64/configs/${{ env.DEFCONFIG }}"
          echo "=== Removing existing conflicting configs ==="
          # Remove existing entries that we want to override
          sed -i '/^CONFIG_SYSVIPC=/d; /^CONFIG_POSIX_MQUEUE=/d; /^CONFIG_PID_NS=/d; /^CONFIG_IPC_NS=/d; /^CONFIG_USER_NS=/d; /^CONFIG_CGROUP_DEVICE=/d; /^CONFIG_CGROUP_PIDS=/d; /^CONFIG_CGROUP_NET_PRIO=/d; /^CONFIG_DEVTMPFS=/d; /^CONFIG_FW_LOADER_COMPRESS=/d; /^CONFIG_BRIDGE_NETFILTER=/d; /^CONFIG_NF_TABLES=/d; /^CONFIG_NETFILTER_XT_TARGET_MASQUERADE=/d; /^CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=/d; /^CONFIG_NF_CONNTRACK_NETLINK=/d; /^CONFIG_NF_CONNTRACK_IPV4=/d; /^CONFIG_ANDROID_PARANOID_NETWORK=/d; /^# CONFIG_ANDROID_PARANOID_NETWORK/d; /^CONFIG_KSU=/d; /^CONFIG_KPM=/d' "$DEFCONFIG_PATH"
          echo "=== Appending OPLUS device config (critical for realme/OPPO boots) ==="
          cat arch/arm64/configs/vendor/oplus.config >> "$DEFCONFIG_PATH"
          echo "=== Appending Droidspaces + SukiSU config fragment ==="
          cat ../droidspaces.config >> "$DEFCONFIG_PATH"
          echo "=== Defconfig tail (last 30 lines) ==="
          tail -30 "$DEFCONFIG_PATH"

      - name: Apply Droidspaces kernel patches
        run: |
          cd kernel
          echo "=== Applying patch 1: xt_qtaguid fix ==="
          patch -p1 --forward < ../patches/01.fix_kernel_panic_in_xt_qtaguid.patch || \
            echo "Patch 1 skipped (may already be applied or needs manual merge)"
          echo "=== Applying patch 2: cgroup prefix fix ==="
          patch -p1 --forward < ../patches/02.fix_restore_cgroup_file_prefix_handling.patch || \
            echo "Patch 2 skipped (may already be applied or needs manual merge)"

      - name: Integrate SukiSU Ultra (kernel-based root)
        run: |
          cd kernel
          echo "=== SukiSU TEMPORARILY DISABLED for boot testing ==="
          echo "Skipping SukiSU integration to verify kernel boot"

      - name: Fix kernel source build errors
        run: |
          cd kernel
          echo "=== Fix 1: qpnp-power-on.c - add missing log_kpd_event member to struct qpnp_pon ==="
          # First undo any previous // comments on log_kpd_event lines
          sed -i '/log_kpd_event/s|^//||' drivers/input/misc/qpnp-power-on.c
          # Add log_kpd_event member to struct qpnp_pon definition
          if grep -q "struct qpnp_pon {" drivers/input/misc/qpnp-power-on.c; then
            sed -i '/struct qpnp_pon {/a\\tint log_kpd_event;' drivers/input/misc/qpnp-power-on.c
            echo "Added log_kpd_event member to struct qpnp_pon"
          else
            echo "struct qpnp_pon not found in .c, trying header files..."
            grep -rl "struct qpnp_pon" drivers/ include/ 2>/dev/null | head -5
          fi
          grep -n "log_kpd_event" drivers/input/misc/qpnp-power-on.c | head -10
          echo "=== Fix 2: oplus_nwpower.c - add forward declaration for get_cached_platform_id ==="
          if [ -f net/oplus_nwpower/oplus_nwpower.c ]; then
            if ! grep -q "get_cached_platform_id" net/oplus_nwpower/oplus_nwpower.c; then
              sed -i '1i int get_cached_platform_id(void);' net/oplus_nwpower/oplus_nwpower.c
            fi
          fi
          echo "=== Fix 3: disable broken schgm-flash.c driver (incomplete struct definitions) ==="
          if [ -f drivers/power/supply/qcom/Makefile ]; then
            sed -i 's/^\(.*schgm-flash.*\)$/#\1/' drivers/power/supply/qcom/Makefile
            sed -i 's/^\(.*scgm-flash.*\)$/#\1/' drivers/power/supply/qcom/Makefile
            grep -i "schgm\|scgm" drivers/power/supply/qcom/Makefile || echo "flash drivers disabled"
          fi
          echo "=== Fix 4: add missing NR_IONCACHE_PAGES to zone_stat_item enum ==="
          if [ -f include/linux/mmzone.h ]; then
            grep -q "NR_IONCACHE_PAGES" include/linux/mmzone.h || sed -i 's/NR_VM_ZONE_STAT_ITEMS };/NR_IONCACHE_PAGES, NR_VM_ZONE_STAT_ITEMS };/' include/linux/mmzone.h
            grep "NR_IONCACHE_PAGES" include/linux/mmzone.h && echo "NR_IONCACHE_PAGES added"
          fi
          echo "=== Fix 5: copy oplus_stubs.S for missing OPLUS symbols ==="
          cp $GITHUB_WORKSPACE/patches/oplus_stubs.S drivers/misc/oplus_stubs.S
          grep -q "oplus_stubs" drivers/misc/Makefile || echo "obj-y += oplus_stubs.o" >> drivers/misc/Makefile
          echo "oplus_stubs.S copied and added to Makefile"

      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          # Use system gcc for host tools (absolute path to avoid Proton Clang's gcc wrapper)
          export HOSTCC=/usr/bin/gcc
          export HOSTCXX=/usr/bin/g++
          # Put system paths before clang to ensure host tools use system linker
          export PATH="/usr/bin:/usr/local/bin:$PATH"
          # Generate .config from defconfig
          make O=out ${{ env.DEFCONFIG }}
          # Auto-resolve config dependencies (olddefconfig = accept defaults for new options)
          make O=out olddefconfig
          echo "=== Verify critical configs in final .config ==="
          grep -E "CONFIG_PID_NS|CONFIG_IPC_NS|CONFIG_CGROUP_DEVICE|CONFIG_DEVTMPFS|CONFIG_SYSVIPC|CONFIG_USER_NS|CONFIG_KSU|CONFIG_KPM|ANDROID_PARANOID" out/.config || true
          # Build - use system gcc for host tools, clang for cross-compilation
          # Tee output to log so we can show errors on failure
          set +e
          make -j$(nproc) O=out \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LDFLAGS_vmlinux="--error-limit=0" \
            KCFLAGS="-Wno-error=implicit-function-declaration -Wno-error=visibility" 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED - Last 80 lines ==="
            tail -80 build.log
            echo "=== Searching for error: lines ==="
            grep -n "error:" build.log | tail -30
            exit $BUILD_EXIT
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
          if-no-files-found: ignore

      - name: Verify build output
        run: |
          ls -lh kernel/out/arch/arm64/boot/Image*
          file kernel/out/arch/arm64/boot/Image

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp kernel/out/arch/arm64/boot/Image.gz AnyKernel/zImage 2>/dev/null || \
            cp kernel/out/arch/arm64/boot/Image AnyKernel/zImage
          cd AnyKernel
          # Disable device check (correct variable name is do.devicecheck, no s)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/do.cleanup=0/do.cleanup=1/g' anykernel.sh
          # Set multiple possible device names for RMX3366 variants
          sed -i 's/device.name1=placeholder/device.name1=RMX3366/g' anykernel.sh
          sed -i 's/device.name2=placeholder/device.name2=RMX3366L1/g' anykernel.sh
          sed -i 's/device.name3=placeholder/device.name3=rmx3366/g' anykernel.sh
          sed -i 's/device.name4=placeholder/device.name4=qcom,rmx3366/g' anykernel.sh
          # Fix boot partition detection: replace static path with dynamic find
          sed -i 's#^block=.*#block=$(find /dev/block -name boot 2>/dev/null | head -1); [ -z "$block" ] \&\& block=/dev/block/bootdevice/by-name/boot; echo "Using boot partition: $block"#' anykernel.sh
          zip -r9 ../droidspaces-kernel-rmx3366.zip * -x .git README.md *placeholder

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            kernel/out/arch/arm64/boot/Image
            kernel/out/arch/arm64/boot/Image.gz

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: droidspaces-kernel-rmx3366-flashable
          path: droidspaces-kernel-rmx3366.zip
